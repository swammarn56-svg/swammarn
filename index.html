<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Bakery ERP">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/style.css">
  <title>Bakery ERP</title>
</head>
<body>
  <header class="topbar">
    <div><strong>Bakery ERP</strong><small>v14.0.0</small></div>
    <span id="connectionStatus" class="status">Checking…</span>
  </header>

  <main id="app">
    <section class="hero">
      <h1>Bakery ERP</h1>
      <p>Supabase foundation for Items, Purchases, Orders, Production, Packaging, Sales and Inventory.</p>
    </section>

    <section class="grid">
      <button data-view="items">Item Dashboard</button>
      <button data-view="purchases">Purchase</button>
      <button data-view="orders">Orders</button>
      <button data-view="production">Production</button>
      <button data-view="packaging">Packaging</button>
      <button data-view="sales">Sales</button>
      <button data-view="reports">Reports</button>
    </section>

    <section id="view" class="panel"></section>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button data-view="dashboard">Dashboard</button>
    <button data-view="purchases">Purchase</button>
    <button data-view="orders">Orders</button>
    <button data-view="sales">Sale</button>
    <button data-view="more">More</button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
