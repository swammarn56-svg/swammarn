<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/style.css">
<title>Bakery ERP · Phase 2</title>
</head>
<body>
<header class="topbar">
  <div><strong>Bakery ERP</strong><small id="appSubtitle">Phase 2 · Sales & Reports</small></div>
  <div class="top-actions"><button id="langBtn" class="ghost">မြန်မာ</button><span id="connectionStatus" class="status">Checking…</span><button id="logoutBtn" class="ghost hidden">Logout</button></div>
</header>

<main>
<section id="authView" class="auth-card hidden">
  <h1 data-i18n="signIn">Sign in</h1>
  <p class="muted" data-i18n="authRequired">Supabase Auth account required.</p>
  <form id="loginForm">
    <label data-i18n="email">Email<input id="email" type="email" required></label>
    <label data-i18n="password">Password<input id="password" type="password" required></label>
    <button class="primary" data-i18n="signIn">Sign in</button>
    <p id="authMessage" class="message"></p>
  </form>
</section>

<section id="mainView" class="hidden">
  <div class="hero">
    <div><h1 id="pageTitle"></h1><p id="pageSub" class="muted"></p></div>
    <button id="primaryAction" class="primary"></button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-page="dashboard">Dashboard</button>
    <button data-page="items">Item Dashboard</button>
    <button data-page="purchases">Purchase</button>
    <button data-page="recipes">Recipe</button>
    <button data-page="orders">Order</button>
    <button data-page="production">Production</button>
    <button data-page="packaging">Packaging</button>
    <button data-page="sales">Sale</button>
    <button data-page="reports">Reports</button>
    <button data-page="more">More</button>
  </nav>
  <section id="content"></section>
</section>
</main>

<dialog id="dialog">
<form id="form" class="dialog-card">
  <div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog" class="icon">×</button></div>
  <div id="formBody"></div><p id="formMessage" class="message"></p>
  <div class="dialog-actions"><button type="button" id="cancelDialog" data-i18n="cancel">Cancel</button><button class="primary" data-i18n="save">Save</button></div>
</form>
</dialog>

<script type="module" src="./js/app.js"></script>
</body>
</html>
